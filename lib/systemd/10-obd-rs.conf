# Drop-in for the overlaybd-tcmu.service that containerd-overlaybd ships.
#
# That unit sets ExecStart=/opt/overlaybd/bin/overlaybd-tcmu while the package
# installs the binary at /usr/bin/overlaybd/overlaybd-tcmu and creates nothing
# under /opt (containerd-overlaybd 1.0.18-ubuntu24.04u2, `dpkg -L`), so a stock
# install fails with status=203/EXEC. ExecStart is a list, and an empty
# assignment is how systemd resets one before appending (systemd.service(5),
# systemd 255, "Command lines").
#
# Pointing at the packaged path rather than at the /opt/overlaybd/bin symlinks
# obd-setup.sh creates keeps the daemon working even when those are gone.
[Service]
ExecStart=
ExecStart=/usr/bin/overlaybd/overlaybd-tcmu

# The shipped unit modprobes target_core_user only. tcm_loop is what turns a
# backstore into a /dev/sdX, and its absence surfaces much later as a device
# that never appears, so it is loaded here too. Non-fatal: on a kernel without
# LOOPBACK_TARGET the daemon is still worth starting, and `obdctl preflight`
# reports what is missing.
ExecStartPre=
ExecStartPre=/sbin/modprobe target_core_user
ExecStartPre=-/sbin/modprobe tcm_loop
